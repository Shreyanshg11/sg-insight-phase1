server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Service worker must never be cached long-term, or clients get stuck on
    # a stale version and never see updates to the fetch/caching logic itself.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Some nginx base images' default mime.types don't include this one —
    # declare it explicitly so browsers don't fall back to octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback — any route not matching a static file goes to index.html
    # so client-side routing (if added later) keeps working on refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container so the browser sees
    # everything as same-origin (no CORS needed) when both run under
    # docker-compose. `backend` resolves via Docker's internal DNS — see
    # docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        # OVERWRITE client-IP headers with the address nginx actually saw; never append or pass through
        # anything the client sent (appending forwarded-for values would let clients forge their IP).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip other client-controlled client-IP headers so the backend can never be fed a spoofed one.
        proxy_set_header Forwarded "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        # Report generation and larger uploads can take a moment.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 51M;
    }
}
