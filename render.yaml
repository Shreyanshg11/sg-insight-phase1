# Render Blueprint — see README.md's Deployment section for the full guide.
# https://render.com/docs/blueprint-spec
#
# Two services, both on the free tier:
#   - sg-insight-backend: Dockerized FastAPI service (backend/Dockerfile)
#   - sg-insight-frontend: native static site (Render builds+hosts the Vite
#     bundle directly — no Docker needed here, and unlike a web service,
#     Render's static hosting is free and never spins down)
#
# IMPORTANT — free tier has no persistent disk (see README): the backend's
# SQLite + pickle-file session data (session 5's work) resets on every
# restart/redeploy on this plan. Fine for a portfolio demo; upgrade to a
# paid plan and add a `disk:` block on the backend service for real
# persistence across restarts.
services:
  - type: web
    name: sg-insight-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Must match the frontend static site's actual onrender.com URL below —
      # update both if either service's assigned name/URL differs from what
      # you set here.
      - key: CORS_ORIGINS
        value: https://sg-insight-frontend.onrender.com
      # AI provider: Render uses the Anthropic API (local development uses Ollama - see README, "AI provider").
      # ANTHROPIC_API_KEY is a secret: `sync: false` makes Render ask for it in the dashboard, so it is never stored here.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: sg-insight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite inlines this at BUILD time — must be the backend's actual public
      # URL, not a private-network address (the browser calls this directly).
      # Update this and rebuild if the backend's assigned name/URL differs.
      - key: VITE_API_URL
        value: https://sg-insight-backend.onrender.com
    routes:
      # SPA fallback so a hard refresh on a deep route doesn't 404.
      - type: rewrite
        source: /*
        destination: /index.html
